esphome:
  name: smart-socket1
  friendly_name: smart_socket1

esp8266:
  board: esp01_1m

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "???"
         
ota:
  - platform: esphome
    password: "???"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Fallback Hotspot"
    password: "??"

captive_portal:

# Use red LED for connectivity status indicator
status_led:
   pin:
     number: GPIO13
     #inverted: true

binary_sensor:
  - platform: gpio
    name: "Plug1 Button"
    pin:
      number: GPIO3
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      - switch.toggle: relay


switch:
- platform: factory_reset
  name: Restart with Factory Default    
- platform: gpio
  name: "Plug1 Relay"
  pin: GPIO14
  id: relay
  restore_mode: ALWAYS_ON

sensor:
  - platform: hlw8012
    model: BL0937
    sel_pin:
      number: GPIO12
      inverted: true
    cf_pin: GPIO04
    cf1_pin: GPIO05
    # Higher value gives lower watt readout
    #current_resistor: "0.003"
    # Lower value gives lower voltage readout
    #voltage_divider: "10051"
    current:
      name: "Plug1 Current"
      accuracy_decimals: 2
      # filters:
      #   # Map from sensor -> measured value
      #   - calibrate_linear:
      #       - 2.45905 -> 0.0
      #       - 2.25141 -> 5.9
      #       - 2.24197 -> 4.3
      #       - 2.41786 -> 10.0

    voltage:
      name: "Plug1 Voltage"
      filters:
      #   # Map from sensor -> measured value
        - calibrate_linear:
          - 33.46 -> 23.802
          - 33.11665 -> 23.524
          - 33.35223 -> 23.770
          - 33.30263 -> 23.882

    power:
      name: "Plug1 Power"
      # filters:
      #   # Map from sensor -> measured value
      #   - calibrate_linear:
      #       - 364.00403 -> 0
      #       - 363.19363 -> 1402.43
      #       - 362.51831 -> 1026.926
      #       - 360.49231 -> 2352.4            
    update_interval: 5s    